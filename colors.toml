# Starship To Orbit: clear, neutral liquid glass over the launch, in the manner of macOS.
# Everything is white, icy white and grey, told apart by brightness rather than hue. Colour is
# kept for meaning: engine-flame orange (the accent, prompt, warnings), red (errors, removed
# lines) and a pale green (success, added lines).
mode = "dark"

accent = "#ff9f0a"
selection = "#3a3a3c"
muted = "#8e8e93"

background = "#1c1c1e"
dark_background = "#161618"
darker_background = "#0e0e10"
lighter_background = "#2c2c2e"

foreground = "#f5f5f7"
dark_foreground = "#98989d"
light_foreground = "#fbfbfd"
bright_foreground = "#ffffff"

red = "#ff5f4a"
yellow = "#ffc27a"
orange = "#ff6a3d"
green = "#ff9f0a"
cyan = "#a6dcef"
blue = "#8fb8de"
magenta = "#ff8fa3"
brown = "#b8a99a"

bright_red = "#ff8373"
bright_yellow = "#ffd8a8"
bright_green = "#ffb340"
bright_cyan = "#cdeefa"
bright_blue = "#b5d0ea"
bright_magenta = "#ffb3c1"

# Window edge: the Raptor plume, white-hot at the top, engine flame, red-orange at the bottom.
hyprland_active_border = "rgba(fff3dcee) rgba(ff9f0add) rgba(ff4f1fcc) 90deg"
hyprland_inactive_border = "rgba(ffffff40) rgba(ffffff12) 135deg"
